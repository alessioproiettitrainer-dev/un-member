# UN-TIMER per Android: GitHub costruisce l'app, la firma con la chiave di Alessio e la carica su Google Play.
# Si avvia a mano (Actions → Run workflow, solo quando è su main) oppure con un'etichetta git untimer-android-N.
# Segreti del repository (Settings → Secrets and variables → Actions):
#   UNTIMER_KEYSTORE_B64   = il file untimer-upload.jks in base64
#   UNTIMER_KEY_PASSWORD   = la password della chiave
#   PLAY_SERVICE_ACCOUNT_JSON = il file JSON dell'account di servizio di Google Play
name: UN-TIMER Android
on:
  push:
    tags: ['untimer-android-*']   # etichetta untimer-android-N = test chiuso, untimer-android-prod-N = per tutti
  workflow_dispatch:
    inputs:
      traccia:
        description: 'Dove caricarla: alpha = test chiuso, internal = test interno, production = per tutti'
        default: 'alpha'
      note:
        description: 'Note della versione (italiano)'
        default: 'Miglioramenti alla voce del coach'
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: untimer-app, shell: 'bash -eo pipefail {0}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Chiave di firma (dai segreti, mai nel repository)
        env:
          KS: ${{ secrets.UNTIMER_KEYSTORE_B64 }}
          PW: ${{ secrets.UNTIMER_KEY_PASSWORD }}
        run: |
          test -n "$KS" -a -n "$PW" || { echo "Mancano i segreti della chiave"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/untimer-upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=untimer\nkeyPassword=%s\n' "$RUNNER_TEMP/untimer-upload.jks" "$PW" "$PW" > android/keystore.properties
      - name: Costruisco il pacchetto (numero di versione = 100 + numero dell'avvio)
        run: cd android && ./gradlew --no-daemon bundleRelease -Pvc=$((100 + ${{ github.run_number }}))
      - name: Note della versione
        run: mkdir -p ../whatsnew && echo "${{ github.event.inputs.note || 'Miglioramenti alla voce del coach' }}" > ../whatsnew/whatsnew-it-IT
      - name: Carico su Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.uncoach.untimer
          releaseFiles: untimer-app/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.traccia || (contains(github.ref_name, 'prod') && 'production') || 'alpha' }}
          status: completed
          whatsNewDirectory: whatsnew
      - name: Pulizia
        if: always()
        run: rm -f "$RUNNER_TEMP/untimer-upload.jks" android/keystore.properties
