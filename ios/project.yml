# Progetto Xcode dell'app iPhone di UN-MEMBER (si genera con XcodeGen: `xcodegen` in questa cartella)
name: UNMEMBER
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  UNMEMBER:
    type: application
    platform: iOS
    sources:
      - UNMEMBER
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uncoach.unmember
        PRODUCT_NAME: UNMEMBER
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: UNMEMBER/Info.plist
        CODE_SIGN_ENTITLEMENTS: UNMEMBER/UNMEMBER.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
