<!doctype html>
<html lang="it" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<title>UN-MEMBER · Stiamo lavorando per voi</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: #0c0c0e; color: #f4f4f5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; }
  .box { max-width: 380px; }
  .bell { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 22px; background: #18181c; display: grid; place-items: center; animation: lift 1.6s ease-in-out infinite; }
  @keyframes lift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  h1 { font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: .3px; margin: 0 0 12px; line-height: 1.15; }
  h1 em { font-style: normal; color: #ff7a00; }
  p { color: #b8b8c0; font-size: 16px; line-height: 1.55; margin: 0 0 12px; }
  .time { display: inline-block; margin: 8px 0 20px; padding: 8px 14px; border-radius: 99px; background: rgba(255, 122, 0, .15); color: #ff7a00; font-weight: 800; font-size: 14px; }
  .bar { height: 5px; border-radius: 3px; background: #222228; overflow: hidden; margin: 0 auto 18px; max-width: 240px; }
  .bar i { display: block; height: 100%; width: 40%; background: #ff7a00; border-radius: 3px; animation: go 1.4s ease-in-out infinite; }
  @keyframes go { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  button { border: 0; border-radius: 14px; padding: 14px 22px; background: #ff7a00; color: #1a0c00; font-weight: 900; font-size: 15px; text-transform: uppercase; cursor: pointer; }
  small { display: block; margin-top: 14px; color: #77777f; font-size: 12px; }
</style>
</head>
<body>
<div class="box">
  <div class="bell"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ff7a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6a3 3 0 0 1 6 0"/><path d="M8 7h8"/><path d="M7.5 9.5A6 6 0 1 0 16.5 9.5Z"/></svg></div>
  <h1>Stiamo lavorando <em>per voi</em> 💪</h1>
  <p>Stiamo portando delle piccole modifiche all'app per migliorarla, o caricando nuovi programmi e video.</p>
  <div class="time">Tra 2, massimo 5 minuti è di nuovo tutto attivo</div>
  <div class="bar"><i></i></div>
  <button onclick="back()">Riprova adesso</button>
  <small id="auto">Riprovo da solo tra <span id="s">20</span> secondi…</small>
</div>
<script>
  // appena il server torna, si riapre da sola la pagina dove eri
  function back() {
    if (location.pathname !== '/lavori.html') return location.reload(); // pagina mostrata al posto di quella chiesta
    let to = '/'; try { to = sessionStorage.getItem('backTo') || '/'; sessionStorage.removeItem('backTo'); } catch {}
    location.replace(to);
  }
  let s = 20;
  setInterval(async () => {
    s--; document.getElementById('s').textContent = Math.max(0, s);
    if (s > 0) return;
    s = 20;
    try { const r = await fetch('/api/settings', { cache: 'no-store' }); if (r.ok) back(); } catch {}
  }, 1000);
</script>
</body>
</html>
