<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap">
<style>*{margin:0;box-sizing:border-box}body{background:transparent;font-family:Montserrat}
.f{width:1080px;height:1920px;position:relative;overflow:hidden}
/* scena con video: sopra e sotto il riquadro video (y 555-1365) sfondo scuro */
.top,.bot{position:absolute;left:0;right:0;background:#0c0c0e}
.top{top:0;height:555px;background:linear-gradient(180deg,#1a0e05 0%,#0c0c0e 100%)}.bot{top:1365px;bottom:0;background:linear-gradient(0deg,#1a0e05 0%,#0c0c0e 100%)}
.cap{position:absolute;left:70px;right:70px;bottom:70px;color:#fff;font-weight:900;font-size:118px;line-height:.95;text-transform:uppercase;letter-spacing:-2px}
.cap em{font-style:normal;color:#ff7a00}
.bar{position:absolute;left:70px;top:300px;width:110px;height:12px;background:#ff7a00;border-radius:6px}
.num{position:absolute;right:70px;top:120px;color:#ff7a00;font-weight:900;font-size:40px;letter-spacing:4px}
.sub{position:absolute;left:70px;right:70px;top:340px;color:#d4d4d8;font-weight:700;font-size:52px;line-height:1.25}
.logo{position:absolute;left:70px;bottom:120px;opacity:.9}
/* intro/outro: velo scuro sopra il video */
.veil{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 45%,rgba(12,12,14,.55),rgba(12,12,14,.92))}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:0 70px}
.big{font-weight:900;font-size:120px;line-height:.95;text-transform:uppercase;letter-spacing:-2px}.big em{font-style:normal;color:#ff7a00}
.mid{font-weight:800;font-size:46px;margin-top:40px;color:#e4e4e7;line-height:1.3}
.btn{margin-top:70px;background:#ff7a00;color:#1a0c00;font-weight:900;font-size:56px;padding:36px 60px;border-radius:36px;text-transform:uppercase}
.url{margin-top:44px;font-weight:800;font-size:40px;color:#a1a1aa}
.pills{display:flex;gap:18px;margin-top:46px}.pills span{border:3px solid #3a3a42;border-radius:22px;padding:16px 26px;font-weight:800;font-size:34px;color:#fff}
</style></head><body>
<script>
const LOGO = (w, c = '#f4f4f5') => `<svg width="${w}" viewBox="0 0 924 516"><path fill="${c}" d="M0 0H130V386H313V0H444V516H0Z M480 0H924V516H793V130H610V516H480Z"/></svg>`;
const SCENES = [
  ['KETTLEBELL', 'Swing, clean, snatch: la tecnica giusta, esercizio per esercizio'],
  ['CALISTHE&shy;NICS', 'Dal primo pull up al muscle up'],
  ['<em>TRX</em>', 'Forza e controllo con il tuo peso'],
  ['DOPPIA <em>KETTLE&shy;BELL</em>', 'Il Programma del mese: nuovo ogni mese, come in palestra'],
  ['SPRINT DA <em>20 MINUTI</em>', 'Poco tempo? Hai fatto lo stesso'],
  ['VIDEO, TIMER <em>E VOCE</em>', 'Tu premi play, al resto pensiamo noi'],
  ['PARLI CON <em>IL COACH</em>', 'Chat diretta con Alessio e una community vera'],
  ['A CASA O <em>AL PARCO</em>', 'Ti alleni dove vuoi, quando vuoi'],
];
let h = `<div class="f" id="intro"><div class="veil"></div><div class="center">${LOGO(560)}<div class="big" style="font-size:96px;margin-top:40px;letter-spacing:14px">MEMBER</div><div class="mid">L'app di allenamento di<br><b style="color:#ff7a00">Alessio Proietti</b> · Unconventional Coach</div></div></div>`;
SCENES.forEach(([c, s], i) => { h += `<div class="f" id="s${i}"><div class="top"><div class="sub">${s}</div><div class="bar"></div></div><div class="bot"><div class="cap">${c}</div></div></div>`; });
h += `<div class="f" id="outro"><div class="veil" style="background:rgba(12,12,14,.9)"></div><div class="center">${LOGO(380)}<div class="big" style="font-size:66px;margin-top:26px;letter-spacing:10px">MEMBER</div>
  <div class="big" style="margin-top:80px">PROVA <em>7 GIORNI</em> GRATIS</div><div class="btn">Inizia ora</div>
  <div class="pills"><span>Presto su Google Play</span><span>App Store</span></div><div class="url">un-member.onrender.com/scopri</div></div></div>`;
document.body.innerHTML = h;
const mode = new URLSearchParams(location.search).get('mode');
if (mode === 'bg') document.querySelectorAll('.sub,.cap').forEach((e) => (e.style.visibility = 'hidden'));
if (mode === 'txt') document.querySelectorAll('.top,.bot').forEach((e) => { e.style.background = 'transparent'; }), document.querySelectorAll('.bar').forEach((e) => (e.style.visibility = 'hidden'));
document.fonts.ready.then(() => document.body.dataset.ok = 1);
</script></body></html>
